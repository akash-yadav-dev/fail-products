name: CI

# The server-side half of the verification layer. A local pre-push hook can be
# bypassed with --no-verify; this cannot. Every check here also runs locally via
# scripts/verify-changes.sh, so a contributor can reproduce a failure offline.

# Two protected branches, so both sides of the promotion path are gated:
# feature/* -> PR -> dev -> PR -> main. A change that never passed on dev must
# not be able to reach main, and the only way to guarantee that is to run the
# same checks on both. .github/BRANCH-PROTECTION.md
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Least privilege by default. Jobs that need more request it explicitly.
# .github/BRANCH-PROTECTION.md
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Always runs. Cheap, and it is the check that protects a public repository.
  # ---------------------------------------------------------------------------
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # Full history so the gate can diff against the base branch.
          fetch-depth: 0

      - name: Verify changes
        run: |
          chmod +x scripts/verify-changes.sh
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # checkout already has full history; fetch the base ref without the
            # invalid `--depth=0` value (git accepts a positive depth only).
            git fetch --no-tags origin "${{ github.base_ref }}"
            # Verify the contributor's head, not GitHub's synthetic merge
            # commit (which has a platform author and no DCO trailer).
            RANGE="origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
          else
            TIP="${{ github.sha }}"
            SECOND_PARENT="$(git rev-parse "$TIP^2" 2>/dev/null || true)"
            FIRST_PARENT="$(git rev-parse "$TIP^1" 2>/dev/null || true)"
            if [ -n "$SECOND_PARENT" ] && [ "$FIRST_PARENT" = "${{ github.event.before }}" ]; then
              # A merge push contains the already-verified PR commits as the
              # second parent. Exclude the GitHub-generated merge metadata.
              RANGE="${{ github.event.before }}..$SECOND_PARENT"
            else
              RANGE="${{ github.event.before }}..$TIP"
            fi
          fi
          echo "Verifying $RANGE"

          # Capture so the classification and impact radius can be surfaced on the
          # PR page. The exit code still decides the job. docs/AI-VERIFICATION.md §3.
          set +e
          OUT="$(bash scripts/verify-changes.sh --range "$RANGE" --ci 2>&1)"
          CODE=$?
          set -e
          printf '%s\n' "$OUT"

          {
            echo "## Verification gate"
            echo
            # No match is normal (an empty range prints nothing), and must not fail the step.
            printf '%s\n' "$OUT" | grep -E '^(Classification|Impact radius|Branch|Scope|Files):' | sed 's/^/    /' || true
            echo
            printf '%s\n' "$OUT" | grep -E '^(BLOCK|WARN) ' | sed 's/^/    /' || true
            echo
            if [ "$CODE" -eq 0 ]; then
              echo "Result: **PASS** — the reviewers this change requires are listed in the log."
            else
              echo "Result: **BLOCK** — see the findings above."
            fi
            echo
            echo "_This gate proves the change is not obviously unsafe. It does not prove it is correct._"
            echo "_Merge readiness is the \`pre-merge-verify\` skill — see [docs/AI-VERIFICATION.md](../blob/${{ github.sha }}/docs/AI-VERIFICATION.md)._"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $CODE

      - name: Test the verification gate itself
        run: |
          # The gate's guards fail silently when they break: a grep that crashes
          # inside a pipeline returns nothing, which reads exactly like "clean".
          # This suite is what makes that failure mode loud. docs/AI-VERIFICATION.md §13.
          chmod +x scripts/test-verify-changes.sh
          bash scripts/test-verify-changes.sh

      - name: Test the pre-push hook itself
        run: |
          # The hook decides which commits the gate ever sees, so a wrong range
          # is a gate that ran and proved nothing about the commits that
          # mattered. It anchored new branches on `main` after `dev` became an
          # integration branch, which re-audited already-published commits and
          # blocked branches over them. Same reasoning as the suite above.
          chmod +x scripts/test-pre-push.sh
          bash scripts/test-pre-push.sh

      - name: Check documentation links
        run: |
          # Every relative markdown link must resolve. Broken links are how a
          # documentation-as-specification project quietly stops being one.
          status=0
          while IFS= read -r file; do
            grep -oE '\]\(\.{0,2}/?[^):]+\.md[^)]*\)' "$file" 2>/dev/null \
            | sed -E 's/^\]\(//; s/\)$//; s/#.*$//' \
            | while IFS= read -r link; do
                [ -z "$link" ] && continue
                target="$(dirname "$file")/$link"
                if [ ! -f "$target" ]; then
                  echo "::error file=$file::broken link -> $link"
                  exit 1
                fi
              done || status=1
          done < <(find . -name '*.md' -not -path './node_modules/*' -not -path './.git/*')
          exit $status

      - name: Validate agent and skill definitions
        run: |
          # Each agent and skill must carry the frontmatter its loader requires.
          status=0
          for f in .claude/agents/*.md; do
            [ -e "$f" ] || continue
            head -1 "$f" | grep -q '^---$' || { echo "::error file=$f::missing frontmatter"; status=1; }
            grep -qE '^name: [a-z0-9-]+$' "$f" || { echo "::error file=$f::missing or invalid 'name:'"; status=1; }
            grep -q '^description: ' "$f" || { echo "::error file=$f::missing 'description:'"; status=1; }
            expected="$(basename "$f" .md)"
            actual="$(grep -m1 '^name: ' "$f" | sed 's/^name: //')"
            [ "$expected" = "$actual" ] || { echo "::error file=$f::name '$actual' does not match filename '$expected'"; status=1; }
          done
          for f in .claude/skills/*/SKILL.md; do
            [ -e "$f" ] || continue
            grep -qE '^name: [a-z0-9-]+$' "$f" || { echo "::error file=$f::missing or invalid 'name:'"; status=1; }
            grep -q '^description: ' "$f" || { echo "::error file=$f::missing 'description:'"; status=1; }
            expected="$(basename "$(dirname "$f")")"
            actual="$(grep -m1 '^name: ' "$f" | sed 's/^name: //')"
            [ "$expected" = "$actual" ] || { echo "::error file=$f::name '$actual' does not match directory '$expected'"; status=1; }
          done
          exit $status

      - name: Validate MCP examples
        run: |
          status=0
          for f in mcp/examples/*.json; do
            [ -e "$f" ] || continue
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              || { echo "::error file=$f::invalid JSON"; status=1; }
          done
          exit $status

      - name: Validate workflow definitions
        run: |
          # A malformed workflow does not fail loudly — GitHub declines to run it
          # and the PR simply shows one fewer check than it should, which reads
          # like a check that has not started yet.
          status=0
          for f in .github/workflows/*.yml .github/actions/*/action.yml; do
            [ -e "$f" ] || continue
            python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" "$f" \
              || { echo "::error file=$f::invalid YAML"; status=1; }
          done
          exit $status

  # ---------------------------------------------------------------------------
  # Detect whether an application exists yet. The repository is currently
  # documentation-only, so the app checks must not fail the build by being absent.
  # ---------------------------------------------------------------------------
  detect:
    name: Detect application
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
      has_e2e: ${{ steps.check.outputs.has_e2e }}
      has_tests: ${{ steps.check.outputs.has_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - id: check
        run: |
          if [ -f package.json ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json — application checks skipped. Repository is pre-implementation."
          fi
          if ls playwright.config.* >/dev/null 2>&1; then
            echo "has_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_e2e=false" >> "$GITHUB_OUTPUT"
          fi
          # No test runner is installed yet. Skip the step rather than fail on a
          # missing script, and rather than fake a passing `test` that asserts
          # nothing — the notice keeps the gap visible on every run.
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No 'test' script — unit and integration tests skipped."
          fi

  # ---------------------------------------------------------------------------
  # The real build gate. Runs only once there is something to build.
  # ---------------------------------------------------------------------------
  app:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # A credential only on a push to a protected branch, never on a pull
      # request. docs/AI-WORKFLOW.md §7 is the constraint: a database credential
      # does not belong in a public repository's PR runs. The reason is specific
      # — a pull_request run uses the *base* branch's workflow file, so a PR
      # cannot rewrite this job to exfiltrate the secret, but it can rewrite a
      # test file, and test files run with whatever the job has. A fork PR gets
      # no secrets at all, so gating on the event keeps every PR identical
      # rather than making coverage depend on who opened it.
      #
      # push to dev and main is where it is safe: both are protected and
      # written by merge only, so the code being run has already been reviewed.
      # That also puts the check exactly where the branch model wants it —
      # dev is where a change is verified before it can be promoted to main.
      - name: Detect database credential
        id: db
        env:
          # A Neon *development* branch, never production (AGENTS.md §8).
          NEON: ${{ secrets.NEON_TEST_DATABASE_URL }}
        run: |
          # Only ever report whether there is one. Never the value.
          if [ -n "${NEON:-}" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "has_db=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_db=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No database in this run - the data-dependent suites will report as skipped, not passed. Set the NEON_TEST_DATABASE_URL secret to cover them on pushes to dev and main."
          fi

      - name: Migrate the test database
        if: steps.db.outputs.has_db == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
        run: pnpm db:migrate

      - name: Test
        if: needs.detect.outputs.has_tests == 'true'
        env:
          # Empty when absent, which is what makes the integration suites skip
          # themselves rather than fail (tests/integration/database.ts).
          DATABASE_URL: ${{ steps.db.outputs.has_db == 'true' && secrets.NEON_TEST_DATABASE_URL || '' }}
        run: pnpm test

      # The step above skips the integration layer silently when there is no
      # database, which is correct. It is not correct when there *is* one: a
      # suite that skipped for an unrelated reason would still read as green.
      # This runs the same layer through scripts/require-database.mjs, which
      # exits non-zero rather than pass having run nothing.
      - name: Integration tests
        if: steps.db.outputs.has_db == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
        run: pnpm test:integration

      - name: Build
        env:
          # Deliberately empty, even when a credential exists. The category and
          # status pages are statically rendered (ADR-027), and a build with a
          # reachable database hides the case where a page reads it at build
          # time. That regression shipped once and this shape is what caught it.
          DATABASE_URL: ""
        run: pnpm build

      - name: Audit production dependencies
        run: |
          # `pnpm audit` exits non-zero for two unrelated reasons: it found an
          # advisory, or it could not reach the advisory service. Only the
          # first is a reason to stop a release.
          #
          # The promotion pull request failed on the second: three POSTs to
          # registry.npmjs.org timed out over five minutes, and the job reported
          # the same red as a real vulnerability would. An outage at npm is not
          # evidence of a vulnerability in this project, and treating it as one
          # teaches people to re-run a red pipeline until it turns green, which
          # is how a genuine finding gets clicked past.
          #
          # So: retry like the pnpm download above, then separate the two cases
          # by what the output says. A real result is honoured, whatever it
          # says. An unreachable service is a warning, and the audit is recorded
          # as not run rather than as passed.
          UNREACHABLE='TimeoutError|ENOTFOUND|EAI_AGAIN|ECONNRESET|ECONNREFUSED|socket hang up|error \(2[0-9]\)|Will retry in'

          set +e
          for attempt in 1 2 3; do
            OUT="$(pnpm audit --prod --audit-level=moderate 2>&1)"
            CODE=$?

            if ! printf '%s' "$OUT" | grep -qE "$UNREACHABLE"; then
              set -e
              printf '%s\n' "$OUT"
              exit $CODE
            fi

            echo "::warning::advisory service unreachable (attempt $attempt of 3); retrying"
            sleep $((attempt * 15))
          done
          set -e

          printf '%s\n' "$OUT"
          echo "::warning::Dependency audit did not run: the npm advisory service was unreachable after 3 attempts. This is NOT a pass -- re-run this job before relying on it for a release."

  # ---------------------------------------------------------------------------
  # E2E is slower and needs a browser, so it is a separate job that only runs
  # once a Playwright config exists.
  #
  # The data-dependent specs skip themselves without DATABASE_URL, so on a pull
  # request this job proves the application compiles and its static routes work,
  # and nothing about comments, reports, or moderation. On a push to dev or main
  # it gets the same Neon development branch the app job used and runs them for
  # real. Same reasoning as the app job above; docs/AI-WORKFLOW.md §7.
  # ---------------------------------------------------------------------------
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [detect, app]
    if: needs.detect.outputs.has_e2e == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Detect database credential
        id: db
        env:
          NEON: ${{ secrets.NEON_TEST_DATABASE_URL }}
        run: |
          # Never echo the value. The app job already migrated this branch.
          if [ -n "${NEON:-}" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "has_db=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_db=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No database in this run - the data-dependent E2E specs will report as skipped, not passed."
          fi

      - name: Run E2E
        env:
          # playwright.config.ts forwards this to the server it starts, and the
          # specs read it to decide whether to skip. Absent means skipped and
          # reported as skipped, never quietly passed.
          DATABASE_URL: ${{ steps.db.outputs.has_db == 'true' && secrets.NEON_TEST_DATABASE_URL || '' }}
        run: pnpm test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Supply chain. GitHub-native, no third-party action, PR-only.
  # ---------------------------------------------------------------------------
  dependencies:
    name: Dependency review
    runs-on: ubuntu-latest
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.has_app == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Explain dependency review status
        if: vars.DEPENDENCY_REVIEW_ENABLED != 'true'
        run: |
          echo "::notice::Dependency review skipped because the repository Dependency graph is disabled."
          echo "Enable Dependency graph and set the DEPENDENCY_REVIEW_ENABLED repository variable to true to activate it."

      - name: Review dependencies
        if: vars.DEPENDENCY_REVIEW_ENABLED == 'true'
        # actions/dependency-review-action v5.0.0
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          # AGPL-3.0-only distribution. docs/CONTRIBUTING.md section 2.
          deny-licenses: GPL-2.0, LGPL-2.0, BSD-4-Clause
