name: Setup
description: Enable pnpm, install Node from .nvmrc, and install dependencies from the lockfile.

# Four jobs repeated these same four steps. Repetition in CI is not just noise:
# when the Node version or the install flags drift between jobs, the failure
# looks like a flaky test rather than the configuration mismatch it is.
#
# Checkout stays in the caller. The hygiene job needs full history to diff
# against its base branch, and burying that in a shared action would hide it.

inputs:
  install:
    description: Install dependencies. Set false for a job that only needs a runtime.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # corepack ships with Node, so pnpm needs no third-party action and adds no
    # supply-chain surface. .github/BRANCH-PROTECTION.md
    #
    # `corepack enable` only writes shims; it downloads nothing. The download
    # happens the first time a shim runs — which, with `cache: pnpm` below, is
    # inside `actions/setup-node` when it calls `pnpm store path` to locate the
    # cache directory. A network blip there fails the whole job before a single
    # check has run, and it does not fail cleanly: corepack's fetch crashed the
    # Node process outright with an undici assertion
    # (`assert(!this.paused)` in `Parser.finish`) when the registry connection
    # ended mid-response. That reads like a broken toolchain rather than a
    # dropped packet, and it took a green run 30 minutes earlier to tell them
    # apart.
    #
    # So the download is pulled forward into a step that owns it and can retry.
    # By the time setup-node probes for the cache, pnpm is already in
    # COREPACK_HOME and no network call is needed.
    - name: Enable pnpm
      shell: bash
      env:
        # Non-interactive: never pause for the "about to download" confirmation.
        COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      run: |
        corepack enable

        # The version comes from packageManager in package.json, so this stays
        # correct without naming it twice.
        for attempt in 1 2 3; do
          if corepack prepare --activate; then
            echo "pnpm $(pnpm --version) ready"
            exit 0
          fi
          echo "::warning::corepack could not fetch pnpm (attempt $attempt of 3); retrying"
          sleep $((attempt * 5))
        done

        echo "::error::corepack could not fetch pnpm after 3 attempts."
        exit 1

    - name: Setup Node
      # actions/setup-node v6
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install
      if: inputs.install == 'true'
      shell: bash
      # --frozen-lockfile: CI installs what was reviewed, and fails if the
      # lockfile and package.json disagree rather than quietly resolving anew.
      run: pnpm install --frozen-lockfile
