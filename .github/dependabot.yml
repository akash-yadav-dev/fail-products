# Automated dependency version updates. Distinct from Dependabot security
# updates (enabled separately in repo settings, no config needed here) --
# this file is for routine version bumps, not vulnerability response.
#
# Targets dev, not main: dev is the integration branch every change goes
# through first. CLAUDE.md section 2, .github/BRANCH-PROTECTION.md.
#
# Shape: at most ONE npm PR of patch/minor bumps and ONE npm PR of majors,
# plus ONE Actions PR. Every npm PR rewrites package.json and pnpm-lock.yaml,
# so each extra PR is another conflict waiting for the first to merge. When
# majors were ungrouped, three PRs (a routine group, @types/node, typescript)
# were merged back to back, "Update branch" merged the lockfile textually,
# left it half-migrated, and broke every install on dev.
#
# Every Dependabot PR is repaired automatically before review by
# .github/workflows/dependabot-autofix.yml: the lockfile is re-resolved,
# pnpm's own security fixes are applied (Dependabot cannot fix a transitive
# pnpm dependency itself), the result is verified, and CI re-runs on it. What
# is left for a human is verify and merge.
#
# When a PR still fails, the autofix comments with the failing check. That
# means the new version is incompatible with the code, not with the lockfile:
# comment `@dependabot ignore this major version` on it, or add an ignore
# below. Never merge it red, and never press "Update branch" on a Dependabot
# PR: it merges pnpm-lock.yaml as text, and once anyone else has pushed to the
# branch Dependabot stops rebasing it. Comment `@dependabot rebase` instead.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    # Two groups below, so two is the most that can be open at once.
    open-pull-requests-limit: 2
    # Let a release settle before proposing it. Version updates only:
    # security updates ignore this and arrive immediately.
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      # Patch and minor bumps land together, one PR to review instead of
      # a dozen.
      routine:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      # Every major in one PR, resolved against the lockfile once. A major
      # is the bump that can break something, so it stays apart from the
      # routine group, but never as one PR per package.
      majors:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # Majors that belong to the Next.js toolchain move when Next moves, not
      # when they are released. eslint-config-next declares loose peer ranges
      # (eslint >=9, typescript >=3.3.1), so Dependabot believes any major is
      # compatible. Both of these were proposed, merged red, and broke lint:
      #   typescript 7  typescript-eslint refuses to load on it
      #                 (typescript-eslint/typescript-eslint#10940)
      #   eslint 10     eslint-plugin-react calls context.getFilename, which
      #                 ESLint 10 removed
      # Take these majors deliberately, in a PR that upgrades Next with them.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # @types/node describes the Node API; the runtime is set by .nvmrc.
      # A newer major types APIs the runtime does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "fix"
      prefix-development: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    # Only default-days: Dependabot rejects the semver-* options for this
    # ecosystem ("not supported for the package ecosystem 'github-actions'").
    cooldown:
      default-days: 3
    groups:
      # Every action bump in one PR. Workflow files rarely conflict, but a
      # bump of several actions is one review and one CI run, not several.
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
